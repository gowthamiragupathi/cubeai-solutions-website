<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 44" fill="none">
  <!-- Cube Brandmark Badge -->
  <rect x="2" y="2" width="40" height="40" rx="10" fill="#0B1220"/>
  <rect x="2" y="2" width="40" height="40" rx="10" stroke="#3B82F6" stroke-width="1.2" stroke-opacity="0.4"/>
  
  <!-- Isometric 3D Cube Structure -->
  <path d="M22 10L33 16.5V29.5L22 36L11 29.5V16.5L22 10Z" stroke="#2563EB" stroke-width="2" stroke-linejoin="round"/>
  <path d="M22 10V23M22 23L33 29.5M22 23L11 29.5" stroke="#60A5FA" stroke-width="1.6" stroke-linejoin="round"/>
  
  <!-- Central Neural Node -->
  <circle cx="22" cy="23" r="2.8" fill="#3B82F6"/>
  <circle cx="22" cy="23" r="1.2" fill="#FFFFFF"/>
  
  <!-- Vertex Highlight Accents -->
  <circle cx="22" cy="10" r="1.4" fill="#60A5FA"/>
  <circle cx="33" cy="16.5" r="1.4" fill="#2563EB"/>
  <circle cx="11" cy="16.5" r="1.4" fill="#2563EB"/>
  <circle cx="22" cy="36" r="1.4" fill="#60A5FA"/>

  <!-- Brand Typography -->
  <g transform="translate(50, 0)">
    <!-- "CUBE" Bold Primary Text -->
    <text x="0" y="24" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18.5" fill="#0B1220" letter-spacing="-0.5">CUBE</text>
    
    <!-- "AI" Accent Badge -->
    <rect x="58" y="10" width="26" height="17" rx="4.5" fill="#2563EB"/>
    <text x="64" y="22.5" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="10.5" fill="#FFFFFF" letter-spacing="0.5">AI</text>
    
    <!-- "SOLUTIONS" Subtitle Text -->
    <text x="1" y="36.5" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="8" fill="#475569" letter-spacing="2.6">SOLUTIONS</text>
  </g>
</svg>
